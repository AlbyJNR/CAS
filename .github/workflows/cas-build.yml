name: CAS Android build
on:
  push:
    branches: [main, design/cas]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write # to refresh the cas-preview release asset and to publish tagged releases
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      signed: ${{ steps.key.outputs.signed }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      # The one CAS signing key, from repository secrets. With it every build installs over the last as an update.
      # Without it (a fork, or secrets not set yet) the build falls back to a debug key, as build.gradle.kts arranges.
      - name: Signing key
        id: key
        env:
          CAS_KEYSTORE_BASE64: ${{ secrets.CAS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$CAS_KEYSTORE_BASE64" ]; then echo "signed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "$CAS_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/cas-release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/cas-release.jks"
            echo "storePassword=${{ secrets.CAS_KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.CAS_KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.CAS_KEY_PASSWORD }}"
          } > keystore.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Lint, test and build
        run: bash gradlew lintRelease testDebugUnitTest assembleRelease --no-daemon --console=plain
      - name: Name the APK
        run: mkdir -p dist && cp app/build/outputs/apk/release/app-release.apk dist/CAS.apk
      - uses: actions/upload-artifact@v5
        with:
          name: CAS-apk
          path: dist/CAS.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: CAS-test-results
          path: app/build/reports/tests/

  # The built APK starts on an Android TV emulator: a build that crashes on launch, or never shows its first screen,
  # is never published. What the unit tests can't see, this does.
  smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: CAS-apk
          path: dist
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch on a TV emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: false
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: |
            adb install dist/CAS.apk
            adb logcat -c
            adb shell am start -n uk.albyjnr.cas/dev.alder.ProfilesActivity
            sleep 20
            adb shell input keyevent KEYCODE_DPAD_CENTER
            sleep 3
            adb exec-out screencap -p > smoke.png
            adb logcat -d > logcat.txt
            if grep -q "FATAL EXCEPTION" logcat.txt; then echo "::error::CAS crashed on launch"; grep -A 20 "FATAL EXCEPTION" logcat.txt | head -40; exit 1; fi
            adb shell dumpsys window | grep -m1 mCurrentFocus | tee focus.txt
            grep -q "uk.albyjnr.cas" focus.txt || { echo "::error::CAS is not the screen in front after launch"; exit 1; }
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: CAS-smoke
          path: |
            smoke.png
            logcat.txt
          if-no-files-found: ignore

  publish:
    needs: [build, smoke]
    if: github.event_name == 'push' && needs.build.outputs.signed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: CAS-apk
          path: dist
      # Every push to a build branch refreshes the one preview download, so the Fire TV Downloader address never
      # changes: https://github.com/<owner>/<repo>/releases/download/cas-preview/CAS.apk
      # Only signed builds are published: a debug-key build would force every TV to uninstall before the next update.
      - name: Publish preview download
        if: startsWith(github.ref, 'refs/heads/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="CAS preview for Android TV and Fire TV (Android 8.0+). Download CAS.apk directly. Release build from ${GITHUB_SHA} (${GITHUB_REF_NAME}): lint, unit tests and a launch on a TV emulator passed in CI. Signed with the CAS release key, so it installs over any other CAS build signed with that key."
          if gh release view cas-preview >/dev/null 2>&1; then
            gh release edit cas-preview --target "$GITHUB_SHA" --prerelease --title "CAS preview — Fire TV test build" --notes "$notes"
          else
            gh release create cas-preview --target "$GITHUB_SHA" --prerelease --title "CAS preview — Fire TV test build" --notes "$notes"
          fi
          gh release upload cas-preview dist/CAS.apk --clobber
      # A tag like v1.0.0 publishes a proper release. CAS's updater (Updates.kt) reads the latest non-prerelease
      # release and offers its CAS.apk on the TV, so the tag must match versionName in app/build.gradle.kts.
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="$(awk -v v="$version" '$0 == "## " v {on=1; next} /^## / {on=0} on' CHANGELOG.md)"
          [ -n "$notes" ] || notes="CAS $version."
          gh release create "$GITHUB_REF_NAME" dist/CAS.apk --title "CAS $version" --notes "$notes" --latest
